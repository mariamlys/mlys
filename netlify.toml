[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirection racine : "/" envoie directement vers le français (langue par défaut).
# force = true → la redirection se fait côté serveur, sans page blanche intermédiaire.
[[redirects]]
  from = "/"
  to = "/fr/"
  status = 302
  force = true

# En-têtes de sécurité de base appliqués à toutes les pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
